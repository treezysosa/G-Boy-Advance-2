name: Build and validate
on:
  push:
    branches-ignore: ['support/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check pinned third-party notices
        run: python3 scripts/check-notices.py
      - name: Check complete source packaging
        run: python3 scripts/package-source.py
      - name: Validate generated factory library
        run: |
          python3 scripts/generate_presets.py
          git diff --exit-code -- Presets/factory.json Source/FactoryData.h
      - name: Build independent DSP tests
        run: |
          cmake -S . -B build -DGBA_BUILD_PLUGIN=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DSP-validation
          path: |
            build/preset-validation.csv
            build/factory-audit.csv
            build/factory-similarity.csv
            build/factory-diversity*.csv
            build/factory-diversity.json
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.6
          path: Dependencies/JUCE
      - uses: actions/checkout@v4
        with:
          repository: steinbergmedia/vst3sdk
          ref: cc2adc90382dded9e347caf74e4532f1458715db
          submodules: recursive
          path: Dependencies/vst3sdk
      - name: Check Windows script syntax
        shell: pwsh
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $tokens=$null; $parseErrors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
      - name: Test installed diagnostics in Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/support/Test-report.ps1 -CollectorPath scripts/collect-windows-diagnostics.ps1 -CollectorRevision 3
      - name: Test installed diagnostics in PowerShell 7
        shell: pwsh
        run: ./scripts/support/Test-report.ps1 -CollectorPath scripts/collect-windows-diagnostics.ps1 -CollectorRevision 3
      - name: Configure Visual Studio 2022 x64
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DGBA_JUCE_PATH="${{ github.workspace }}/Dependencies/JUCE" -DBUILD_TESTING=ON -DGBA_BUILD_BENCHMARKS=ON
      - name: Build VST3, standalone and tests
        run: cmake --build build --config Release --parallel 2
      - name: Run engine and integration tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Validate the actual VST3 in pluginval
        shell: pwsh
        run: ./scripts/validate-windows.ps1 -Strictness 10
      - name: Run separate official Steinberg validator
        shell: pwsh
        run: ./scripts/validate-steinberg-windows.ps1
      - name: Compare CPU and audio against the previous engine
        shell: pwsh
        run: ./scripts/compare-cpu-windows.ps1
      - name: Package portable archive and installer
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Iscc 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
      - uses: actions/download-artifact@v4
        with:
          name: G-Boy-Advance-2-Installer-x64
          run-id: 39265210389
          github-token: ${{ github.token }}
          path: build/previous-installer
      - name: Exercise install, upgrade, reinstall, standalone launch and uninstall
        shell: pwsh
        run: ./scripts/test-installer-windows.ps1 -PreviousInstaller build/previous-installer/G-Boy-Advance-2-Setup-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: G-Boy-Advance-2-Installer-x64
          path: dist/G-Boy-Advance-2-Setup-x64.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: G-Boy-Advance-2-Portable-x64
          path: dist/G Boy Advance 2/**
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G-Boy-Advance-2-Windows-x64
          path: |
            dist/*.zip
            dist/*.exe
            build/GBoyAdvance2_artefacts/Release/VST3/**
            build/GBoyAdvance2_artefacts/Release/Standalone/**
            build/GBA2-editor.png
            build/ui-snapshots/**
            build/preset-validation.csv
            build/factory-diversity*.csv
            build/factory-diversity.json
            build/Testing/Temporary/LastTest.log
            build/validation-logs/**
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Factory-preset-auditions-Windows
          path: |
            build/preset-auditions/**
            build/vocal-auditions/**
            build/factory-audit.csv
            build/factory-similarity.csv
            build/hiphop-auditions/**
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Retro-preset-auditions-Windows
          path: build/retro-auditions/**
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Detroit-piano-auditions-Windows
          path: build/groove-auditions/Hip-Hop - Detroit/**
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Chicago-Drill-auditions-Windows
          path: build/groove-auditions/Hip-Hop - Chicago Drill/**
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Funk-auditions-Windows
          path: build/groove-auditions/Funk/**
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Japan-inspired-auditions-Windows
          path: build/groove-auditions/Japan Inspired/**
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Eighties-auditions-Windows
          path: build/groove-auditions/80s Pop/**
