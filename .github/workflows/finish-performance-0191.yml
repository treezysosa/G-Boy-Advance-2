name: Verify and package 0.19.1 release
on:
  push:
    branches: ['support/pad-sf2-release-0191']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require identical validated production source
        shell: pwsh
        run: |
          git diff --exit-code 3ac7cb29e939ed1a7e2039586038160a304e1518 -- Source Presets CMakeLists.txt
          if ($LASTEXITCODE -ne 0) { throw 'Production source changed after runtime validation.' }
          python scripts/check-notices.py
          if ($LASTEXITCODE -ne 0) { throw 'Pinned dependency check failed.' }
      - uses: actions/download-artifact@v4
        with:
          name: G-Boy-Advance-2-Windows-x64
          run-id: 43087833818
          github-token: ${{ github.token }}
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: UI-skins-and-browser-Windows
          run-id: 43087833818
          github-token: ${{ github.token }}
          path: build/ui-snapshots
      - name: Export immutable previous effects implementation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/reference-0190 | Out-Null
          git archive --format=tar --output=build/reference-0190.tar 4d6011fd971e1e0e73a8aeab2e6195811baf4896 Source
          if ($LASTEXITCODE -ne 0) { throw 'Reference export failed.' }
          tar -xf build/reference-0190.tar -C build/reference-0190
          if ($LASTEXITCODE -ne 0) { throw 'Reference extraction failed.' }
      - name: Compare finite bypass history with the released engine using MSVC
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          if errorlevel 1 exit /b 1
          python scripts/check-drive-bypass-reference.py build/reference-0190 --compiler cl --report build/validation-logs/drive-bypass-reference.json
      - name: Package unchanged binaries with the complete current source and manual
        shell: pwsh
        run: |
          python scripts/package-source.py
          if ($LASTEXITCODE -ne 0) { throw 'Source archive validation failed.' }
          ./scripts/package-windows.ps1 -Iscc 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
      - uses: actions/download-artifact@v4
        with:
          name: G-Boy-Advance-2-Installer-x64
          run-id: 43076162724
          github-token: ${{ github.token }}
          path: build/previous-installer
      - name: Verify the final installer lifecycle and user-data preservation
        shell: pwsh
        run: ./scripts/test-installer-windows.ps1 -PreviousInstaller build/previous-installer/G-Boy-Advance-2-Setup-x64.exe
      - name: Verify source, archives, binaries, audio, CPU and all 40 skins
        run: python scripts/verify-release-0191.py
      - uses: actions/upload-artifact@v4
        with:
          name: G-Boy-Advance-2-Installer-x64
          path: dist/G-Boy-Advance-2-Setup-x64.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: G-Boy-Advance-2-Portable-x64
          path: dist/G Boy Advance 2/**
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G-Boy-Advance-2-Windows-x64
          path: |
            dist/*.zip
            dist/*.exe
            build/GBoyAdvance2_artefacts/Release/VST3/**
            build/GBoyAdvance2_artefacts/Release/Standalone/**
            build/Testing/Temporary/LastTest.log
            build/validation-logs/**
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UI-skins-and-browser-Windows
          path: build/ui-snapshots/**
